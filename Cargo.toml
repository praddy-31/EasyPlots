# The Rust "workspace": one repo, several crates, one shared build folder (target/).
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
easyplots-core = { path = "crates/core" }

[profile.release]
# Smaller, faster app: optimise across crates and drop debug symbols.
lto = true
codegen-units = 1
strip = true
