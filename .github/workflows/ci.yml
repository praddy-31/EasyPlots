# Checks on every push, and the macOS build that makes the .dmg for a release.
#
# - engine (Linux, every push and pull request): format, lint and test the engine and the
#   terminal command.
# - macos (macOS): lint the app and build EasyPlots.app + .dmg, for pull requests, manual
#   runs, and every published GitHub release: the .dmg, the terminal command and their
#   SHA-256 sums are then attached to that release. A release is made with
#   `gh release create vX.Y.Z --target main …`; this workflow fills in its downloads.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p easyplots-core -p easyplots-cli --all-targets -- -D warnings
      - run: cargo test -p easyplots-core -p easyplots-cli

  macos:
    name: macOS app build
    runs-on: macos-latest
    needs: engine
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p easyplots-app --all-targets -- -D warnings
      - run: cargo test --workspace
      # Signing without a paid Apple account: an optional self-made "Code Signing"
      # certificate (Keychain Access → Certificate Assistant), stored as repository
      # secrets. Each build is then signed by the same certificate, so macOS sees updates
      # as the same app and keeps its permissions. Without the secrets, ad hoc signing.
      - name: Use the signing certificate (if set up)
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$(echo "$CERT" | tr -d '\n ')"
              echo "APPLE_CERTIFICATE_PASSWORD=$PASS"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing with the certificate \"$IDENTITY\"."
          else
            echo "No signing certificate set up: signing ad hoc."
          fi
      - name: Build EasyPlots.app and .dmg
        run: npm run tauri build
        working-directory: app
      - name: Show how the app is signed
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|Signature' || true
          codesign -d -r- "$app" 2>&1 | tail -1 || true
      - name: Build the easyplots terminal command
        # tar keeps the "executable" permission, which a plain download would lose.
        run: |
          cargo build --release -p easyplots-cli
          tar -czf easyplots-cli-macos-arm64.tar.gz -C target/release easyplots
      - name: Find the .dmg
        id: dmg
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -n 1)
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          out="EasyPlots-$version-arm64.dmg"
          cp "$dmg" "$out"
          shasum -a 256 "$out" easyplots-cli-macos-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPlots-dmg
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: easyplots-cli
          path: easyplots-cli-macos-arm64.tar.gz
          retention-days: 14
      - name: Attach the downloads to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          want="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          [ "$tag" = "$want" ] || { echo "release $tag but the app says $want: bump the version first"; exit 1; }
          gh release upload "$tag" "${{ steps.dmg.outputs.path }}" easyplots-cli-macos-arm64.tar.gz SHA256SUMS.txt --clobber
